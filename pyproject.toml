[project]
name = "qztmf-patterns"
version = "0.1.0"
description = "Reference implementations of the QZTMF cryptographic agility engineering patterns (Algorithm Abstraction Layer, Dual-Signature Validation, Key Material Versioning, Quantum Risk Score)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qztmf_patterns*"]
